# ANZAR en production sur le VPS Hetzner partagé avec ShagoStore : PostgreSQL + API.
# Pas de Caddy ici : celui de ShagoStore reçoit le HTTPS et transmet anzar-api.issalanhub.com
# à ce service (réseau Docker « issalan_passerelle », nom « anzar-api »).
# Cloison avec ShagoStore : ANZAR ne rejoint que la passerelle, où il n'y a que le Caddy de ShagoStore ;
# il ne voit ni la base ni l'API ShagoStore, et ShagoStore ne voit pas sa base. Conteneurs sans droits
# système et limités en mémoire, processeur et processus : ANZAR ne peut pas étouffer ShagoStore.
# Lancement : ./initialiser.sh   puis   docker compose up -d --build
name: anzar

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: anzar
      POSTGRES_USER: anzar
      POSTGRES_PASSWORD: ${PG_PASSWORD:?à définir dans .env}
    volumes:
      - pgdata:/var/lib/postgresql
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anzar -d anzar"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [donnees]
    # Aucun port publié : la base n'est joignable que par l'API (réseau interne, sans Internet).
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 0.5
    pids_limit: 256

  api:
    build: ../services/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: production
      PORT: "8000"
      DATABASE_URL: postgresql://anzar:${PG_PASSWORD}@db:5432/anzar
      JWT_SECRET: ${JWT_SECRET:?à définir dans .env}
      OTP_SECRET: ${OTP_SECRET:?à définir dans .env}
      ADMIN_DEFAULT_EMAIL: ${ADMIN_DEFAULT_EMAIL:-abdul@issalanhub.com}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:?à définir dans .env}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?clé DeepSeek à mettre dans .env}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      # Suivi automatique des erreurs (scripts/erreurs, DeepSeek Harness) ; vide = désactivé
      ERROR_ANALYSIS_TOKEN: ${ERROR_ANALYSIS_TOKEN:-}
      SENDER_EMAIL: ${SENDER_EMAIL:-no-reply@issalanhub.com}
      SENDER_NAME: ${SENDER_NAME:-ANZAR}
      DEEPSEEK_MARGIN: ${DEEPSEEK_MARGIN:-3.0}
      # Accès strictement payant : aucun crédit offert à l'inscription.
      WELCOME_BONUS_FCFA: ${WELCOME_BONUS_FCFA:-0}
      # Paiements automatiques (vides = désactivés ; la recharge manuelle reste disponible)
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://anzar-api.issalanhub.com}
      FEDAPAY_SECRET_KEY: ${FEDAPAY_SECRET_KEY:-}
      FEDAPAY_ENVIRONMENT: ${FEDAPAY_ENVIRONMENT:-sandbox}
      FEDAPAY_WEBHOOK_SECRET: ${FEDAPAY_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
      FLUTTERWAVE_WEBHOOK_HASH: ${FLUTTERWAVE_WEBHOOK_HASH:-}
      # Taux d'affichage téléchargés une fois par jour (ExchangeRate-API, puis Frankfurter)
      FX_AUTO_REFRESH: ${FX_AUTO_REFRESH:-true}
    networks:
      donnees: {}
      sortie: {}          # Internet : DeepSeek, Brevo, fournisseurs de paiement, taux de change
      passerelle:
        aliases: [anzar-api]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: 0.7   # le VPS n’a qu’un processeur : ANZAR en laisse toujours à ShagoStore
    pids_limit: 256
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Panneau admin (fichiers statiques) : le Caddy de ShagoStore le sert sur anzar-admin.issalanhub.com
  admin:
    build:
      context: ../apps/admin
      args:
        VITE_BACKEND_URL: https://anzar-api.issalanhub.com
    restart: unless-stopped
    networks:
      passerelle:
        aliases: [anzar-admin]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # Port 80 sans root ni capacité système (les images tournent sous l'utilisateur « web »)
    sysctls: { net.ipv4.ip_unprivileged_port_start: 80 }
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

  # Vitrine getanzar.com (fichiers statiques) : le Caddy de ShagoStore la sert sur getanzar.com
  site:
    build: ../apps/site
    restart: unless-stopped
    networks:
      passerelle:
        aliases: [anzar-site]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # Port 80 sans root ni capacité système (les images tournent sous l'utilisateur « web »)
    sysctls: { net.ipv4.ip_unprivileged_port_start: 80 }
    mem_limit: 64m
    pids_limit: 32
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

networks:
  # Base + API, sans Internet.
  donnees:
    internal: true
  # Sortie vers Internet pour l'API seulement.
  sortie: {}
  # Réseau créé par ShagoStore (/root/shagostore/deploy) : son Caddy y joint l'API et le panneau, rien d'autre.
  passerelle:
    name: issalan_passerelle
    external: true

volumes:
  pgdata:
