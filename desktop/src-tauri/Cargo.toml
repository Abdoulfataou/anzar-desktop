[package]
name = "app"
version = "2.0.0"
description = "ANZAR - Assistant IA de Vibecoding pour l'Afrique"
authors = ["IssalanHub"]
license = ""
repository = ""
default-run = "app"
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [ "protocol-asset"] }
dirs = "5.0"
blake3 = "1.5"
# Transport HTTP des serveurs MCP (déjà présent dans les dépendances via l'updater)
reqwest = { version = "0.11", features = ["json"] }
# PATH du shell de l'utilisateur (apps lancées depuis le Finder)
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
# Node.js géré par ANZAR (téléchargé une fois si absent) : vérification et décompression
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
tauri-plugin-stronghold = { version = "2" }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
keyring = "4.2.0"

# Stronghold : le hachage scrypt est lent en debug (recommandation du plugin).
[profile.dev.package.scrypt]
opt-level = 3

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]
