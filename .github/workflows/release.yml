name: Release (Tauri)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      # « true » seulement si un certificat Apple est fourni dans les secrets du dépôt
      APPLE_SIGNE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node.js 24)

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node.js 24)
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            apps/desktop/src-tauri -> target

      # Notes de version (apps/desktop/NOUVEAUTES.md) : affichées dans la release GitHub et
      # dans le bandeau de mise à jour de l'app (« Voir les nouveautés »).
      - name: Notes de version
        id: notes
        shell: bash
        run: |
          {
            echo "texte<<FIN_NOTES"
            cat apps/desktop/NOUVEAUTES.md 2>/dev/null || true
            echo "FIN_NOTES"
          } >> "$GITHUB_OUTPUT"

      # Deux variantes de construction :
      # - certificat Apple « Developer ID Application » présent dans les secrets : app signée,
      #   notariée et vérifiée (Gatekeeper l'ouvre sans avertissement) ;
      # - sinon (pas de compte développeur Apple payant) : Windows inchangé, et sur Mac une app
      #   signée « ad hoc », non notariée. Elle fonctionne, mais macOS demande une confirmation
      #   au premier lancement (expliqué sur getanzar.com/…/telecharger).
      # Remettre le secret APPLE_CERTIFICATE (et les autres APPLE_*) suffit à repasser en signé.
      - name: Build & publish (Tauri) — signé Apple
        if: env.APPLE_SIGNE == 'true' || matrix.platform != 'macos-latest'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auto-updater signing (Tauri 2). Les anciens noms restent acceptés en repli.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          # Signature + notarisation macOS (Developer ID).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

          # Sentry sourcemaps upload (optional)
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
          tagName: v__VERSION__
          releaseName: "ANZAR v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.texte }}
          releaseDraft: true
          prerelease: false

      # Sans compte Apple payant : signature avec le certificat personnel ANZAR s'il est fourni
      # (secrets MAC_CERT_P12 / MAC_CERT_PASSWORD, créés par scripts/creer-certificat-mac.sh).
      # Même identité à chaque version → le trousseau macOS ne redemande plus l'accès aux
      # données d'ANZAR après une mise à jour. Sinon, ou si le certificat est inutilisable :
      # signature ad hoc, comme avant.
      - name: Certificat personnel (Mac sans compte Apple)
        id: certmac
        if: env.APPLE_SIGNE != 'true' && matrix.platform == 'macos-latest'
        working-directory: apps/desktop
        shell: bash
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -uo pipefail
          ADHOC=src-tauri/tauri.adhoc.conf.json
          if [ -z "${MAC_CERT_P12:-}" ]; then
            echo "Pas de certificat personnel : signature ad hoc."
            echo "config=$ADHOC" >> "$GITHUB_OUTPUT"; exit 0
          fi
          NOM="ANZAR Signature"
          KC="$RUNNER_TEMP/anzar-signature.keychain-db"
          KCMDP="$(openssl rand -hex 16)"
          printf '%s' "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCMDP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCMDP" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCMDP" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # Essai sur un binaire jetable avec les options de Tauri, avant la vraie construction.
          cp /usr/bin/true "$RUNNER_TEMP/essai"
          if codesign --force --options runtime --timestamp -s "$NOM" "$RUNNER_TEMP/essai" \
             && codesign -d -r- "$RUNNER_TEMP/essai" > "$RUNNER_TEMP/exigence.txt" 2>&1 \
             && grep -Eq 'certificate (root|leaf)' "$RUNNER_TEMP/exigence.txt"; then
            printf '{"bundle":{"macOS":{"signingIdentity":"%s"}}}\n' "$NOM" > src-tauri/tauri.perso.conf.json
            echo "config=src-tauri/tauri.perso.conf.json" >> "$GITHUB_OUTPUT"
            echo "perso=true" >> "$GITHUB_OUTPUT"
            echo "✓ Certificat personnel prêt."
          else
            echo "::warning::Certificat personnel inutilisable : repli sur la signature ad hoc."
            echo "config=$ADHOC" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & publish (Tauri) — Mac non notarié (sans certificat Apple)
        if: env.APPLE_SIGNE != 'true' && matrix.platform == 'macos-latest'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          projectPath: apps/desktop
          # Certificat personnel ANZAR, ou signature « ad hoc » (identité « - ») à défaut :
          # une signature est obligatoire pour lancer une app sur puce Apple.
          args: --config ${{ steps.certmac.outputs.config }} ${{ matrix.args }}
          tagName: v__VERSION__
          releaseName: "ANZAR v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.texte }}
          releaseDraft: true
          prerelease: false

      # Refuse de publier un binaire macOS non signé/non notarié QUAND un certificat est fourni :
      # c'est exactement l'erreur qui rend l'app inouvrable chez les utilisateurs.
      # Les apps installées n'acceptent qu'une mise à jour signée avec la clé de tauri.conf.json.
      - name: Vérifier la clé de signature des mises à jour
        shell: bash
        run: node scripts/verifier-cle-maj.mjs

      - name: Vérifier signature et notarisation (macOS)
        if: matrix.platform == 'macos-latest' && env.APPLE_SIGNE == 'true'
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          APP=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$APP" || { echo "Aucun .app produit"; exit 1; }
          echo "Application : $APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee /tmp/codesign.txt
          grep -q "Developer ID Application" /tmp/codesign.txt
          xcrun stapler validate "$APP"
          spctl --assess --verbose=2 --type execute "$APP"

      - name: Vérifier la signature (macOS sans compte Apple)
        if: matrix.platform == 'macos-latest' && env.APPLE_SIGNE != 'true'
        working-directory: apps/desktop
        env:
          PERSO: ${{ steps.certmac.outputs.perso }}
        run: |
          set -euo pipefail
          APP=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$APP" || { echo "Aucun .app produit"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"
          if [ "$PERSO" = "true" ]; then
            # L'identité exigée doit reposer sur le certificat (stable), pas sur l'empreinte du binaire.
            codesign -d -r- "$APP" 2>&1 | tee /tmp/exigence.txt
            grep -Eq 'certificate (root|leaf)' /tmp/exigence.txt
            ! grep -q 'cdhash' /tmp/exigence.txt
            echo "::notice::Mac signé avec le certificat personnel ANZAR : plus de demande du trousseau après les mises à jour."
          else
            codesign -dv "$APP" 2>&1 | grep -q "Signature=adhoc"
          fi
          echo "::warning::Mac non notarié (aucun certificat Developer ID) : macOS demandera une confirmation au premier lancement."
