name: CI

on:
  pull_request:
  push:
    # windows-* : branches de travail sur la parité Windows (plan PARITE-WINDOWS).
    branches: [ main, master, 'windows-*' ]
  # Bouton « Run workflow » : relance tout, y compris le job Windows ARM.
  workflow_dispatch:

jobs:
  api:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node.js 24)

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Tests (pytest)
        run: python -m pytest tests/ -v

  desktop:
    name: Desktop (lint/build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node.js 24)

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node.js 24)
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck (lint)
        run: npm run lint

      - name: Tests (Vitest)
        run: npm test

      # Même suite sous les deux autres plateformes simulées : une fonction n'est finie que
      # si elle tient sur Mac et sur Windows (docs/desktop/PARITE-WINDOWS.md).
      - name: Tests (Vitest, macOS simulé)
        env:
          ANZAR_TEST_PLATFORM: mac
        run: npx vitest run src/

      - name: Tests (Vitest, Windows simulé)
        env:
          ANZAR_TEST_PLATFORM: windows
        run: npx vitest run src/

      - name: Build (Vite)
        run: npm run build

  rust:
    name: Desktop Rust (cargo)
    # macOS : c'est la plateforme où l'isolation Seatbelt est utilisée, et le seul runner
    # qui compile Tauri sans dépendance système supplémentaire. Windows est couvert par le
    # build de release (tag).
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node.js 24)

      # tauri::generate_context! lit frontendDist (../dist) à la compilation : un index
      # minimal suffit pour les tests unitaires, sans payer le build Vite complet.
      - name: Frontend placeholder
        working-directory: apps/desktop
        run: mkdir -p dist && printf '<!doctype html><title>ANZAR CI</title>' > dist/index.html

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Tests (cargo test)
        run: cargo test --all-targets

      # too_many_arguments : les commandes Tauri exposent leurs paramètres un par un.
      - name: Lint (clippy)
        run: cargo clippy --all-targets -- -D warnings -A clippy::too_many_arguments

  rust-windows:
    name: Desktop Rust (Windows)
    # Compile et exécute réellement le code `#[cfg(windows)]` (job object, chemins,
    # futurs jetons restreints). Sans ce job, une erreur Windows ne se découvre qu'au
    # moment de publier une release.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node.js 24)

      # tauri::generate_context! lit frontendDist (../dist) à la compilation.
      - name: Frontend placeholder
        working-directory: apps/desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Set-Content -Path dist/index.html -Value '<!doctype html><title>ANZAR CI</title>'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Tests (cargo test)
        run: cargo test --all-targets

      - name: Lint (clippy)
        run: cargo clippy --all-targets -- -D warnings -A clippy::too_many_arguments

  rust-windows-arm:
    name: Desktop Rust (Windows ARM)
    # PC Windows sur processeur ARM (Copilot+). Lancé seulement à la demande pour ménager
    # les minutes GitHub : onglet Actions → CI → « Run workflow ».
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-11-arm
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node.js 24)

      - name: Frontend placeholder
        working-directory: apps/desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Set-Content -Path dist/index.html -Value '<!doctype html><title>ANZAR CI</title>'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Tests (cargo test)
        run: cargo test --all-targets

  desktop-windows:
    name: Desktop Windows (Vitest, build, bout en bout)
    # La même suite Vitest que sur Linux, mais sur un vrai Windows et avec la plateforme
    # Windows simulée dans jsdom ; puis la vraie application compilée et pilotée par
    # WebDriver (tauri-driver + Edge Driver). macOS n'a pas de pilote WebDriver : ce job
    # est le seul qui teste l'interface d'ANZAR de bout en bout.
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
        shell: pwsh
    steps:
      # Sans ça, git convertit les fins de ligne en CRLF et les tests qui lisent des
      # fichiers du dépôt ne voient pas le même contenu que sur Mac.
      - name: Fins de ligne identiques à Mac
        working-directory: .
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node.js 24)

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node.js 24)
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/desktop/e2e/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      # Met aussi en cache ~/.cargo/bin : tauri-driver n'est compilé qu'une fois.
      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "apps/desktop/src-tauri -> target"
          key: desktop-windows

      - name: Install
        run: npm ci

      - name: Typecheck (lint)
        run: npm run lint

      # src/ seulement : bench/ est le banc d'essai réel, écrit pour l'isolation Seatbelt de macOS.
      - name: Tests (Vitest, plateforme Windows)
        env:
          ANZAR_TEST_PLATFORM: windows
        run: npx vitest run src/

      - name: Build de l'application (debug, sans installateur)
        run: npx tauri build --debug --no-bundle

      - name: Installer tauri-driver
        run: cargo install tauri-driver --locked

      - name: Edge Driver assorti à WebView2
        run: ./e2e/scripts/prepare-edgedriver.ps1

      - name: Tests de bout en bout (WebDriver)
        working-directory: apps/desktop/e2e
        run: |
          npm ci
          npm test

      - name: Captures des tests ratés
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-captures-windows
          path: apps/desktop/e2e/artefacts/
          if-no-files-found: ignore
