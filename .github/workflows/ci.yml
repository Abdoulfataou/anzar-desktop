name: CI

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  api:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Tests (pytest)
        run: python -m pytest tests/ -v

  desktop:
    name: Desktop (lint/build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck (lint)
        run: npm run lint

      - name: Tests (Vitest)
        run: npm test

      - name: Build (Vite)
        run: npm run build

  rust:
    name: Desktop Rust (cargo)
    # macOS : c'est la plateforme où l'isolation Seatbelt est utilisée, et le seul runner
    # qui compile Tauri sans dépendance système supplémentaire. Windows est couvert par le
    # build de release (tag).
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # tauri::generate_context! lit frontendDist (../dist) à la compilation : un index
      # minimal suffit pour les tests unitaires, sans payer le build Vite complet.
      - name: Frontend placeholder
        working-directory: apps/desktop
        run: mkdir -p dist && printf '<!doctype html><title>ANZAR CI</title>' > dist/index.html

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Tests (cargo test)
        run: cargo test --all-targets

      # too_many_arguments : les commandes Tauri exposent leurs paramètres un par un.
      - name: Lint (clippy)
        run: cargo clippy --all-targets -- -D warnings -A clippy::too_many_arguments

  rust-windows:
    name: Desktop Rust (Windows)
    # Compile et exécute réellement le code `#[cfg(windows)]` (job object, chemins,
    # futurs jetons restreints). Sans ce job, une erreur Windows ne se découvre qu'au
    # moment de publier une release.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # tauri::generate_context! lit frontendDist (../dist) à la compilation.
      - name: Frontend placeholder
        working-directory: apps/desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Set-Content -Path dist/index.html -Value '<!doctype html><title>ANZAR CI</title>'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Tests (cargo test)
        run: cargo test --all-targets

      - name: Lint (clippy)
        run: cargo clippy --all-targets -- -D warnings -A clippy::too_many_arguments
