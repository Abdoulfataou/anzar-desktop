[package]
name = "app"
version = "2.1.1"
description = "ANZAR - Assistant IA de Vibecoding pour l'Afrique"
authors = ["IssalanHub"]
license = ""
repository = ""
default-run = "app"
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [ "protocol-asset"] }
dirs = "5.0"
# Transport HTTP des serveurs MCP (déjà présent dans les dépendances via l'updater)
reqwest = { version = "0.12", features = ["json"] }
# PATH du shell de l'utilisateur (apps lancées depuis le Finder)
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
# Node.js géré par ANZAR (téléchargé une fois si absent) : vérification et décompression
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
keyring = "4.2.0"

# Windows : les commandes de l'agent tournent dans un « job object » (arrêt de toute
# l'arborescence de processus, presse-papiers et réglages système inaccessibles).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]
